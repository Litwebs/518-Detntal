name: Build and deploy 518 Dental

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check direct routes and legacy links
        run: npm run test:routes
      - name: Build and publish with npm run deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run deploy -- --repo "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" --user "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
